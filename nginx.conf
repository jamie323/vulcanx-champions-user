server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Cache headers ────────────────────────────────────────────────────────
    # HTML: no-cache — the app itself requests no-cache via <meta> tags, so
    # honour that here too. Testers always get the freshest bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # JS modules: versioned via ?v=... query strings in index.html, so
    # a short max-age is fine. Bump to 1y if you add content-hash filenames.
    location ~* \.js$ {
        add_header Cache-Control "public, max-age=86400";  # 1 day
    }

    # JSON data (bloodlines.json) — short cache so updates propagate quickly.
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600";   # 1 hour
    }

    # Static images + video — long cache; filenames never change in place.
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800"; # 7 days
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # All unrecognised paths serve index.html so deep-links work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Healthcheck endpoint (used by Docker / k8s probes) ───────────────────
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
